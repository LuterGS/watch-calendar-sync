// Classes the Compose compiler cannot infer as stable, but which are.
//
// Compose treats a class from a module that was not built with the Compose
// compiler as unstable. Everything in :shared falls into that bucket, so the
// agenda screen was passed an "unstable" CalendarSnapshot — which disables
// skipping and forces recomposition on every scroll frame.
//
// These are immutable data holders (all vals, primitives/String/Boolean), so
// declaring them stable is accurate rather than a workaround. The alternative,
// applying the Compose compiler to :shared, would drag the Compose runtime into
// a module that contains no UI.
dev.lutergs.watchcalsync.shared.model.*

// java.time value types are deeply immutable but live outside Compose's knowledge.
java.time.LocalDate
java.time.Instant
java.time.ZoneId
